  /login/pedidos/historico: ##############
    get:
      tags:
      - Pedidos
      summary: Histórico de pedidos do cliente
      description: >
        Consulta de histórico de pedidos do cliente no sistema com possibilidade de utilizar filtros de pesquisa, escolher
        a ordenação e a paginação. Perfis permitidos: CLIENTE e GESTAO.
      security:
      - bearerAuth: []
      parameters:
      - name: unidadeId
        in: query
        required: false
        description: Filtra pelo ID da unidade.
        schema:
          type: integer
          minimum: 1
      - name: pedidoId
        in: query
        required: false
        description: Filtra pelo ID do pedido.
        schema:
          type: integer
          minimum: 1
      - name: status
        in: query
        required: false
        description: Filtra pelo status do pedido.
        schema:
          type: boolean
      - name: canalPedido
        in: query
        required: false
        description: Filtra pelo canal em que o pedido foi feito.
        schema:
          type: string
          enum:
          - WEB
          - PICKUP
          - TOTEM
          - BALCAO
          - APP
      - name: entrega
        in: query
        required: false
        description: Filtra se os pedidos foram por entrega ou retirada.
        schema:
          type: boolean
      - name: dataInicio
        in: query
        required: false
        description: Filtra pedidos a partir da data inicial.
        schema:
          type: string
          format: date
        example: "2026-08-01"
      - name: dataFim
        in: query
        required: false
        description: Filtra pedidos até a data final informada.
        schema:
          type: string
          format: date
        example: "2026-08-01"
      - name: valorMin
        in: query
        required: false
        description: Filtra pedidos com o menor valor total.
        schema:
          type: number
          format: double
          minimum: 0
      - name: valorMax
        in: query
        required: false
        description: Filtra pedidos com o maior valor total.
        schema:
          type: number
          format: double
          minimum: 0
      - name: ordenar
        in: query
        required: false
        description: Define a ordenação dos resultados.
        schema:
          type: string
          default: pedidoId_desc
          enum:
          - pedidoId_asc
          - pedidoId_desc
          - dataPedido_asc
          - dataPedido_desc
          - valorTotal_asc
          - valorTotal_desc
      - name: page
        in: query
        required: false
        description: Número da página.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Quantidade máxima de registros por página.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        "200":
          description: Histórico de pedidos consultado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPedidosResponse'
        "401":
          description: Token JWT ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "TOKEN_ACESSO"
                message: "Token de acesso expirado ou inválido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login/pedidos/historico"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "403":
          description: Usuário sem permissão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "USUARIO_NAO_PERMITIDO"
                message: "O usuário logado não tem permissão para acessar este conteúdo."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login/pedidos/historico"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "422":
          description: Um ou mais filtros informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "FILTRO_INVALIDO"
                message: "O filtro informado é inválido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login/pedidos/historico"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "ERRO_INTERNO"
                message: "Ocorreu um erro interno no servidor."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login/pedidos/historico"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
      operationId: consultaPedidoCliente
