  /usuario/{usuarioId}/delete:
    delete:
      tags:
      - Usuários
      summary: Excluir usuário.
      description: >
        Excluir usuário permanentemente. (Ação excluirá de forma permanente toda a atividade realizada pelo cliente). Perfis
        permitidos: ADMINISTRADOR, GESTAO e CLIENTE (usuário da conta a deletar)
      operationId: deleteUsuario
      security:
      - bearerAuth: []
      parameters:
      - name: usuarioId
        in: path
        required: true
        description: Usuário que será excluído.
        schema:
          type: integer
          minimum: 1
      responses:
        "200":
          description: Usuário excluído com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaSucesso"
              example:
                message: "O usuário foi excluído com sucesso."
        "401":
          description: Token JWT ausente ou inválido.
          content:
