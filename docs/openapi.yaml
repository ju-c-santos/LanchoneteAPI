components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CadastroUsuarioResponse:
      type: object
      properties:
        message:
          type: string
          example: "Cadastro realizado com sucesso."
        data:
          type: object
          properties:
            id: 
              type: integer
              example: "1"
            nome: 
              type: string
              example: "pessoaTeste"
            email:
              type: string 
              example: "clienteteste@email.com"
            telefone:
              type: string
              example: "241234567890"
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login realizado com sucesso."
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: "eyJhbGciOiJIUzI1NiIs..."
    ApiError:
      type: object
      properties:
        error:
          type: string
          example: "USUARIO_NAO_ENCONTRADO"
        message:
          type: string
          example: "O usuário informado não foi encontrado."
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "usuario"
              issue:
                type: string
                example: "O usuário informado não existe."
        timestamp:
          type: string
          format: date-time
          example: "2026-08-07T08:30:00-03:00"
        path:
          type: string
          example: "/login"
        requestId:
          type: string
          format: uuid
          example: "baaf6e1b-5217-41af-9877-2298562e65e3"
  