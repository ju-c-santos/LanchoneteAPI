  /usuario/{usuarioId}/delete:
    delete:
      tags:
        - Usuários
      summary: Deletar usuário.
      description: > 
        Deletar usuário permanentemente. (Ação excluiá de forma permanente toda a atividade realizada pelo cliente).
        Perfis permitidos: ADMINISTRACAO, GESTAO e CLIENTE (usuário da conta a deletar)
      operationId: deleteUsuário
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
