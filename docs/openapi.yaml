openapi: 3.1.1

info:
  title: API Lanchonete
  version: 1.0.0
  description: >
    API REST para gerenciamento de pedidos,
    produtos, estoque, usuários, pagamentos
    e unidades da lanchonete.

servers:
  - url: https://minha-api.onrender.com
    description: Servidor de produção

tags:
  - name: Autenticação
    description: Login e autenticação dos usuários

  - name: Registros #engloba todos os registros criados
    description: Resistros de pessoas, produtos, unidades e estoques no sistema.

  - name: Usuários
    description: Gerenciamento de usuários.

  - name: Pedidos #alteração de dados e consultas
    description: Gerenciamento e consulta de pedidos.

  - name: Funcionários
    description: Gerenciamento de funcionários.

  - name: Produtos #alteração de dados e consultas
    description: Gerenciamento dos produtos.

  - name: Promoções
    description: Gerenciamento de promoções.

  - name: Estoque #alteração de dados e consultas
    description: Controle de estoque por unidade.

  - name: Pagamentos
    description: Processamento dos pagamentos.

  - name: Unidades #alteração de dados e consultas
    description: Gerenciamento das unidades.

#--> aqui é onde ficam as rotas
paths:
  /usuario/register:
    post:
      tags:
      - Registros
      - Usuários
      summary: Realizar cadastro
      description: Cadastra clientes e funcionários, salvando dados pessoais de contato e credenciais de acesso.
      operationId: cadastrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nome
              - email
              - cpf
              - telefone
              - senha
              properties:
                nome:
                  type: string
                  description: Nome do cliente.
                  example: "Laissa Eduarda"
                email:
                  type: string
                  description: E-mail para contato e para realizar o login.
                  example: clienteteste@email.com
                  format: email
                cpf:
                  type: string
                  description: CPF do cliente. Os dados pessoais são tratados conforme a LGPD (Lei nº 13.709/2018).
                  example: "12345678900"
                telefone:
                  type: string
                  description: Telefone do cliente para contato.
                  example: "(24)00000-0000"
                cep:
                  type: string
                  description: CEP do endereço do cliente para entrega (não obrigatório).
                  example: "00000-000"
                senha:
                  type: string
                  description: Senha para login
                  example: "123456"
                  format: password
      responses:
        "201":
          description: Cadastro realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadastroUsuarioResponse"
              example:
                message: "Usuário cadastrado com sucesso."
                data:
                  id: 2
                  nome: Laissa Eduarda
                  email: clienteTeste@gmail.com
                  telefone: (24)12345-6789
        "400":
          description: Requisição inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "JSON_INVALIDO"
                message: "O corpo da requisição deve ser um JSON válido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/register"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "409":
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "CPF_JA_CADASTRADO"
                message: "O CPF informado já se encontra cadastrado em outra conta."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/register"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "422":
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "CPF_INVALIDO"
                message: "O dado CPF deve ser uma string."
                details: [{field: "cpf", issue: "Exemplo correto: '123456' - Exemplo incorreto: 123456."}]
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/register"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "ERRO_INTERNO"
                message: "Ocorreu um erro interno no servidor."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/register"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
  /login:
    post:
      tags:
      - Autenticação
      - Usuários
      summary: Realizar login
      description: Autentica um usuário por meio do e-mail ou CPF e da senha cadastrada.
      operationId: realizarLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
              - usuario
              - senha

              properties:
                usuario:
                  type: string
                  description: E-mail ou CPF do usuário.
                  example: clienteteste@email.com

                senha:
                  type: string
                  format: password
                  description: Senha do usuário.
                  example: '123456'
      responses:
        "400":
          description: Requisição inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "JSON_INVALIDO"
                message: "O corpo da requisição deve ser um JSON válido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "404":
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "USUARIO_NAO_ENCONTRADO"
                message: "O usuário informado não foi encontrado."
                details: [{field: "usuarioId", issue: "O usuário com ID 3 não existe."}]
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "422":
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "DADOS_INVALIDOS"
                message: "Os dados informados são inválidos."
                details: [{field: "usuario", issue: "O campo usuário é obrigatório."}]
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "ERRO_INTERNO"
                message: "Ocorreu um erro interno no servidor."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/login"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        '200':
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                message: "Login realizado com sucesso."
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIs..."
  /usuario/alteracao/{usuarioId}:
    patch:
      tags:
      - Usuários
      summary: Atualizar informações cadastrais de um usuário.
      description: >
        Permite alterar os dados: Email, Telefone, CEP e Senha Perfis permitidos: Usuário do cadastro, ADMINISTRADOR e GESTAO.
      operationId: atualizarCadastro
      security:
      - bearerAuth: []
      parameters:
      - name: usuarioId
        in: path
        required: true
        description: ID do usuário que será atualizado.
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tipoDado
              - novoValor
              properties:
                tipoDado:
                  type: string
                  description: "Campo que será alterado. Valores permitidos: email, telefone, cep e senha."
                  example: "email"
                novoValor:
                  type: string
                  example: "emailAtualizado@email.com"
      responses:
        "200":
          description: Cadastro alterado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadastroUsuarioResponse"
              example:
                message: "Cadastro atualizado com sucesso."
                data:
                  usuarioId: 2
                  email: laissaEdu@gmail.com
                  telefone: (24)12345-6789
                  cep: 00000-000
        "400":
          description: Requisição inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "JSON_INVALIDO"
                message: "O corpo da requisição deve ser um JSON válido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/alteracao/2"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "401":
          description: Token JWT ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "TOKEN_ACESSO"
                message: "Token de acesso expirado ou inválido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/alteracao/2"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "403":
          description: Usuário sem permissão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "USUARIO_NAO_PERMITIDO"
                message: "O usuário logado não tem permissão para alterar."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/alteracao/2"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "404":
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "USUARIO_NAO_ENCONTRADO"
                message: "Não foi possível encontrar este usuário."
                details: [{field: "usuarioId", issue: "O usuário com o ID 2 não existe."}]
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/alteracao/2"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "422":
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "ALTERACAO_INVALIDA"
                message: "Não é possível alterar este campo."
                details: [{field: "tipoDado", issue: "Apenas os campos 'EMAIL', 'TELEFONE', 'CEP, e 'SENHA', podem ser alterados."}]
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/alteracao/2"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "500":
          description: Erro interno do servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "ERRO_INTERNO"
                message: "Ocorreu um erro interno no servidor."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/usuario/alteracao/2"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
