  /admin/promocoes: ###########
    get:
      tags:
      - Promoções
      summary: Listar promoções
      description: >
        Consulta de promoções cadastradas no sistema com possibilidade de utilizar filtros de pesquisa, escolher a ordenação
        e a paginação. Perfis permitidos: ADMINISTRADOR, GERENCIA e GESTAO.
      security:
      - bearerAuth: []
      parameters:
      - name: promocaoId
        in: query
        required: false
        description: Filtra pelo ID da promoção.
        schema:
          type: integer
          minimum: 1
      - name: nomePromocao
        in: query
        required: false
        description: Filtra pelo nome da promoção.
        schema:
          type: string
      - name: produtoId
        in: query
        required: false
        description: Filtra pelo ID do produto em promoção.
        schema:
          type: integer
          minimum: 1
      - name: tipoPromocao
        in: query
        required: false
        description: Filtra pelo tipo de desconto da promoção.
        schema:
          type: string
          enum:
          - PERCENTUAL
          - VALOR_FIXO
      - name: dataInicio
        in: query
        required: false
        description: Filtra promoções a partir da data inicial.
        schema:
          type: string
          format: date
        example: "2026-08-01"
      - name: dataFim
        in: query
        required: false
        description: Filtra promoções até a data final informada.
        schema:
          type: string
          format: date
        example: "2026-08-01"
      - name: valorMin
        in: query
        required: false
        description: Filtra promoções com o menor valor de desconto.
        schema:
          type: number
          format: double
          minimum: 0
      - name: valorMax
        in: query
        required: false
        description: Filtra promoções com o maior valor de desconto.
        schema:
          type: number
          format: double
          minimum: 0
      - name: ativa
        in: query
        required: false
        description: Filtra promoções de acordo com seu status de atividade.
        schema:
          type: boolean
      - name: ordenacao
        in: query
        required: false
        description: Define a ordenação dos resultados.
        schema:
          type: string
          default: promocaoId_asc
          enum:
          - promocaoId_asc
          - promocaoId_desc
          - nomePromo_asc
          - nomePromo_desc
          - dataPromo_asc
          - dataPromo_desc
      - name: page
        in: query
        required: false
        description: Número da página.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        description: Quantidade máxima de registros por página.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        "200":
          description: Lista de promoções consultada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPromocoesResponse'
        "401":
          description: Token JWT ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "TOKEN_ACESSO"
                message: "Token de acesso expirado ou inválido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "403":
          description: Usuário sem permissão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "USUARIO_NAO_PERMITIDO"
                message: "O usuário logado não tem permissão para acessar este conteúdo."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
