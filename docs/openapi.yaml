      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - unidadeId
              - entrega
              - canalPedido
              - usarPontos
              - itempedido
              properties:
                unidadeId:
                  type: integer
                  description: ID da unidade em que será feito o pedido.
                  example: 2
                observacao:
                  type: string
                  description: Descrição do pedido.
                  example: "Retirar cebola."
                entrega:
                  type: boolean
                  description: Informa se o pedido terá ou não entrega.
                  example: true
