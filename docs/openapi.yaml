  /usuario/<int:usuario_id>/delete:
    delete:
      tags:
        - Usuários
      sumary: Deletar usuário.
      description: > 
        Deletar usuário permanentemente. (Ação excluiá de forma permanente toda a atividade realizada pelo cliente).
        Perfis permitidos: ADMINISTRACAO, GESTAO e CLIENTE (usuário da conta a deletar)
      operationId: deleteUsuário
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          description: Usuário que será deletado.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
      responses:
        "200":
          description: Usuário deletado com sucesso.
          content:
