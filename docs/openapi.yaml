  /admin/promocoes:
    get:
      tags:
        - Promoções
      summary: Listar promoções
      description: > 
        Consulta de promoções cadastradas no sistema com possibilidade de utilizar filtros de pesquisa, escolher a ordenação e paginação.
        Perfis permitidos: ADMINISTRADOR, GERENCIA e GESTAO.
      operatioId: consultaPromocao
      security:
        - bearerAuth: []
      parameters:
        - name: promocaoId
          in: query
          required: false
          description: Filtra pelo Id da promoção.
          schema:
            type: integer
            minimum: 1
        - name: nomePromocao
          in: query
          required: false
          description: Filtra pelo nome da promoção.
          schema:
            type: string
        - name: produtoId
          in: query
          required: false
          description: Filtra pelo Id do produto em promoção.
          schema:
            type: integer
            minimum: 1
        - name: tipoPromocao
          in: query
          required: false
          description: Filtra pelo tipo de desconto da promoção.
          schema:
            type: str
            enum:
              - PERCENTUAL
              - VALOR_FIXO
        - name: dataInicio
          in: query
          required: false
          description: Filtra promoções a partir da data inicial.
          schema:
            type: string
            format: date
          example: "YYYY-MM-DD"
        - name: dataFim
          in: query
          required: false
          description: Filtra promoções até a data final informada.
          schema:
            type: string
            format: date
          example: "YYYY-MM-DD"
        - name: valorMin
          in: query
          required: false
          description: Filtra promoções com o menor valor de desconto.
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: valorMax
          in: query
          required: false
          description: Filtra promoções com o maior valor de desconto.
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: ativa
          in: query
          required: false
          description: Filtra promoções de acordo com seus status.
          schema:
            type: boolean
        - name: ordenacao
          in: query
          required: false
          description: Define a ordenação dos resultados.
          schema:
            type: string
            default: promocaoId_asc
            enum:
              - promocaoId_asc
              - promocaoId_desc
              - nomePromo_asc
              - nomePromo_desc
              - dataPromo_asc
              - dataPromo_desc
        - name: page
          in: query
          required: false
          description: Número da página.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de registros por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      requestBody:
        required: false
      responses:
        "200":
          description: Lista de promoções consultada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadastroUsuarioResponse"
              example:
                message: "Lista de promoções consultada com sucesso."
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/Promocao"   
                meta:
                  $ref: "#/components/schemas/PaginationMeta"    
        "401":
          description: Token JWT ausente ou inválido.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "TOKEN_ACESSO"
                message: "Token de acesso expirado ou inválido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "403":
          description: Usuário sem permissão.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "USUARIO_NAO_PERMITIDO"
                message: "O usuário logado não tem permissão para acessar este conteúdo."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3" 
        "422":
          description: Um ou mais filtros informados são inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"  
              example:
                error: "FILTRO_INVALIDO"
                message: "O filtro informádo é inválido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"                                                       
        "500":
          description: Erro interno do servidor.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "ERRO_INTERNO"
                message: "Ocorreu um erro interno no servidor."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
            
            
                                                          
                        








components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CadastroUsuarioResponse:
      type: object
      properties:
        message:
          type: string
          example: "Usuário cadastrado com sucesso."
        data:
          type: object
          properties:
            id: 
              type: integer
              example: 1
            nome: 
              type: string
              example: "pessoaTeste"
            email:
              type: string 
              example: "clienteteste@email.com"
            telefone:
              type: string
              example: "241234567890"
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login realizado com sucesso."
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: "eyJhbGciOiJIUzI1NiIs..."
    CadastroUnidadeResponse:
      type: object
      properties:
        message:
          type: string
          example: "Unidade cadastrada com sucesso."
        data:
          type: object
          properties:
            endereco:
              type: string
              example: "Rua das melancias, 7"
            bairro:
              type: string
              example: "Vegetais"
            cep:
              type: string
              example: "12345-678"
            cidade:
              type: string
              example: "Resende"
            estado:
              type: string
              example: "RJ"
    CadastroFuncionarioResponse:
      type: object
      properties:
        message:
          type: string
          example: "Unidade cadastrada com sucesso."
        data:
          type: object
          properties:
            usuarioId:
              type: integer
              example: 1
            unidadeId:
              type: string
              example: 2
            cargo:
              type: string
              example: "ATENDENTE"
    Promocao:
      type: object
      properties:
        promocaoId:
          type: integer
          example: 5
        nome:
          type: string
          example: "Combo de verão"
        produtoId:
          type: integer
          example: 3
        unidadeId:
          type: integer
          example: 1
        tipoDesconto:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
          example: PERCENTUAL
        valorDesconto:
          type: string
          example: "10.00"
        quantidadeMinima:
          type: integer
          example: 2
        ativa:
          type: boolean
          example: true
        dataInicio:
          type: string
          format: date-time
          example: "2026-08-01T00:00:00"
        dataFim:
          type: string
          format: date-time
          example: "2026-08-31T23:59:59"
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3
        hasNext:
          type: boolean
          example: true
        hasPrevious:
          type: boolean
          example: false
    ApiError:
      type: object
      properties:
        error:
          type: string
          example: "USUARIO_NAO_ENCONTRADO"
        message:
          type: string
          example: "O usuário informado não foi encontrado."
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "usuario"
              issue:
                type: string
                example: "O usuário informado não existe."
        timestamp:
          type: string
          format: date-time
          example: "2026-08-07T08:30:00-03:00"
        path:
          type: string
          example: "/login"
        requestId:
          type: string
          format: uuid
          example: "baaf6e1b-5217-41af-9877-2298562e65e3"
  