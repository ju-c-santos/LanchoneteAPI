  /admin/register:
    post:
      tags:
        - Registros
        - Funcionários
      summary: Realizar cadastro dos funcionários administrativos
      description: > 
        Cadastra funcionários, salvando sua unidade e cargo.
        Apenas a gestão pode realizar esta ação.
      operationId: cadastrarFuncionarioAdministrativo
      security:
        - bearerAuth: []      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuarioId
                - unidadeId
                - cargo
              properties:
                usuarioId:
                  type: integer
                  description: Id de usuário cadastrado do funcionário.
                  example: 2
                unidadeId:
                  type: integer
                  description: Id de cadastro da unidade em que o funcionário atua.
                  example: 3
                cargo:
                  type: string
                  description: Cargo do funcionário. (podendo ser 'GERENCIA' ou 'ADMINISTRADOR')
                  example: "GERENCIA"
      responses:
        "201":
          description: Cadastro realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadastroFuncionarioResponse"
              example:
                message: "Funcionário cadastrado com sucesso."
                data:
                  usuarioId: 2
                  unidadeId: 1
                  cargo: GERENCIA
        "400":
          description: Requisição inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "JSON_INVALIDO"
                message: "O corpo da requisção deve ser um JSON válido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/register"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "409":
          description: Conflito interno.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "FUNCIONARIO_JA_CADASTRADO"
                message: "O cpf informado já se encontra cadastrado em outra conta."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/register"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"                 
        "422":
          description: Dados inválidos.
          content: 
            application/json:
