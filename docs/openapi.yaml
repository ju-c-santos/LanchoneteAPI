  /admin/promocoes/criar:
    post:
      tags:
        - Registros
        - Promoções
      summary: Cadastrar novas promoções
      description: Cadastra novas promoções e campanhas.
      operationId: cadastrarPromocao
      security:
        - bearerAuth: []      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - produtoId
                - unidadeId
                - tipoDesconto
                - valorDesconto
                - quantidadeMinima
                - dataInicio
                - dataFim
              properties:
                nome:
                  type: string
                  description: Nome da campanha.
                  example: "Campanha teste"
                produtoId:
                  type: integer
                  description: Id do produto em promoção.
                  example: 2
                unidadeId:
                  type: integer
                  description: Id da unidade em que está ocorrendo a campanha.
                  example: 3
                tipoDesconto:
                  type: string
                  enum:
                    - VALOR_FIXO
                    - PERCENTUAL
                  description: Define o tipo de deconto que será aplicado em cima do valor informado podendo ser = percentual ou valor_fixo.
                  example: "PERCENTUAL"
                valorDesconto:
                  type: number
                  format: float
                  description: Valor do desconto (pode ser tanto em porcentagem quanto em real).
                  example: 5 #esse valor pode ser tanto R$5 quanto 5%, o que define é o tipoDesconto
                dataInicio:
                  type: string
                  format: date
                  description: Data de início da campanha. (modelo YYYY-MM-DD)
                  example: "2026-08-01" 
                dataFim:
                  type: string
                  format: date
                  description: Data final da campanha. (modelo YYYY-MM-DD)
                  example: "2026-08-30"
      responses:
        "201":
          description: Promoção cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadastroUsuarioResponse"
              example:
                message: "Uma nova campanha/promoção foi cadastrada."
                data:
                  nome: "campanhaTeste"
                  produtoId: 2
                  unidadeId: 1
                  tipoDesconto: "PERCENTUAL"
                  valorDesconto: 20.0
                  dataInicio: "2026-03-01"
                  dataFim: "2026-04-01"
        "400":
          description: Requisição inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: "JSON_INVALIDO"
                message: "O corpo da requisção deve ser um JSON válido."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes/criar"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"
        "409":
          description: Conflito interno.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "CPF_JA_CADASTRADO"
                message: "O cpf informado já se encontra cadastrado em outra conta."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes/criar"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"                 
        "422":
          description: Dados inválidos.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "TIPO_DESCONTO_INVALIDO"
                message: "O tipo de desconto inserido é inválido."
                details: [{
                  field: "tipoDesconto",
                  issue: "Valores válidos: PERCENTUAL, VALOR_FIXO."
                }]
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes/criar"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3" 
        "500":
          description: Erro interno do servidor.
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError" 
              example:
                error: "ERRO_INTERNO"
                message: "Ocorreu um erro interno no servidor."
                details: []
                timestamp: "2026-08-07T08:30:00-03:00"
                path: "/admin/promocoes/criar"
                requestId: "baaf6e1b-5217-41af-9877-2298562e65e3"  
